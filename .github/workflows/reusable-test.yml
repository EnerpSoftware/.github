name: Reusable Test Runner

on:
  workflow_call:
    inputs:
      test-command:
        description: 'Command to run tests'
        required: true
        type: string
      project-type:
        description: 'node or python'
        required: true
        type: string
      working-directory:
        default: '.'
        type: string
      runs-on:
        description: 'Runner label (self-hosted or ubuntu-latest)'
        default: 'ubuntu-latest'
        type: string
      create-bug-on-failure:
        description: 'Create GitHub issue on test failure'
        default: true
        type: boolean

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
    outputs:
      test-result: ${{ steps.test.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.project-type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: inputs.project-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Node)
        if: inputs.project-type == 'node'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (Python)
        if: inputs.project-type == 'python'
        working-directory: ${{ inputs.working-directory }}
        run: pip install -r requirements.txt

      - name: Run tests
        id: test
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true
        run: ${{ inputs.test-command }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results/
            **/coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Create bug issue on failure
        if: steps.test.outcome == 'failure' && inputs.create-bug-on-failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: `[AUTO-BUG] Test failure in ${context.sha.substring(0, 7)}`,
              body: `## Automatycznie wygenerowany bug

            ### Informacje o buildzie
            - **Commit:** ${context.sha}
            - **Branch:** ${context.ref}
            - **Workflow run:** [Link do logow](${runUrl})
            - **Autor:** @${context.actor}

            ### Wymagane dzialania
            - [ ] Przeanalizowac logi testow
            - [ ] Zidentyfikowac przyczyne
            - [ ] Naprawic i utworzyc PR

            ---
            *Ten issue zostal automatycznie utworzony przez CI/CD pipeline.*
            `,
              labels: ['bug', 'auto-generated', 'ci-failure'],
              assignees: [context.actor]
            });

            console.log(`Created issue #${issue.data.number}`);

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
