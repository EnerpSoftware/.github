name: Reusable Python Build

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        default: '3.11'
        type: string
      working-directory:
        description: 'Working directory'
        default: '.'
        type: string
      runs-on:
        description: 'Runner label (self-hosted or ubuntu-latest)'
        default: 'ubuntu-latest'
        type: string
      fail-on-lint:
        description: 'Fail build on lint/type errors'
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install ruff
          ruff check .
        continue-on-error: ${{ inputs.fail-on-lint == false }}

      - name: Type check with mypy
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install mypy
          mypy . --ignore-missing-imports
        continue-on-error: ${{ inputs.fail-on-lint == false }}
